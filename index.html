<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>深夜食堂 · 玩家榜</title>
<meta name="description" content="深夜食堂服务器的排行榜和每个人的主线进度，每 10 分钟更新一次">
<style>
:root{
  --bg:#0d111b; --bg2:#121827; --card:#161d2e; --card2:#1b2438; --line:#26304a; --line2:#323e5c;
  --ink:#e8e3d6; --ink2:#a9b0c2; --ink3:#6f7891;
  --amber:#f2a541; --amber2:#ffcf7a; --amber-soft:rgba(242,165,65,.14);
  --red:#e0614a; --jade:#6fc49a; --jade-soft:rgba(111,196,154,.14); --violet:#b79cff; --sky:#7fa8ff;
  --mono:"Cascadia Mono","JetBrains Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif}
body{min-height:100vh;background:radial-gradient(1000px 420px at 80% -120px,rgba(242,165,65,.11),transparent 60%),var(--bg)}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 50px}
header{display:flex;align-items:center;gap:14px;padding:22px 0 16px;flex-wrap:wrap}
.lantern{width:38px;height:44px;position:relative;flex:none}
.lantern i{position:absolute;left:5px;top:6px;width:28px;height:32px;border-radius:14px/16px;background:radial-gradient(circle at 50% 45%,#ffd890,#f2a541 55%,#b9531f);box-shadow:0 0 26px rgba(242,165,65,.55)}
.lantern::before,.lantern::after{content:"";position:absolute;left:13px;width:12px;height:4px;border-radius:2px;background:#3a2a1c}
.lantern::before{top:3px}.lantern::after{bottom:3px}
h1{margin:0;font-size:22px;letter-spacing:2px}
.sub{color:var(--ink3);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 12px;border-radius:99px;font-size:13px;border:1px solid var(--line2);background:var(--bg2)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ink3)}
.pill.on{border-color:rgba(111,196,154,.4);background:var(--jade-soft)}.pill.on .dot{background:var(--jade);box-shadow:0 0 8px var(--jade)}
.spacer{flex:1}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{border:1px solid var(--line2);background:var(--card);padding:7px 16px;border-radius:10px;cursor:pointer;color:var(--ink2)}
.tabs button.act{background:var(--amber-soft);border-color:rgba(242,165,65,.5);color:var(--amber2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.chip{border:1px solid var(--line2);background:var(--card);padding:4px 12px;border-radius:99px;cursor:pointer;font-size:13px;color:var(--ink2)}
.chip.act{background:var(--amber-soft);border-color:rgba(242,165,65,.5);color:var(--amber2)}
.card{background:linear-gradient(180deg,var(--card),#141a29);border:1px solid var(--line);border-radius:14px;padding:15px 17px;min-width:0}
.card h3{margin:0 0 10px;font-size:13.5px;font-weight:600;color:var(--ink2);display:flex;gap:8px;align-items:baseline}
.card h3 .r{margin-left:auto;font-weight:400;font-size:12px;color:var(--violet)}
.grid{display:grid;gap:12px}
.boards{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.row{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:4px 0;font-size:13px}
.row .md{text-align:center}
.row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:12.5px}
.row.first .nm{color:var(--amber2);font-weight:600}
.row .tr{grid-column:2/4;height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:-2px}
.row .tr i{display:block;height:100%;background:var(--amber)}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.wall>div{display:flex;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cnt{font:700 22px var(--mono);color:var(--amber2);line-height:1}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tags span{font-size:11px;padding:1px 7px;border-radius:6px;background:var(--amber-soft);color:var(--amber2);border:1px solid rgba(242,165,65,.35)}
.ava{width:40px;height:40px;border-radius:9px;background:var(--card2);flex:none;display:grid;place-items:center;font-weight:700;font-size:17px;color:var(--amber);overflow:hidden;image-rendering:pixelated}
.ava img{width:100%;height:100%}
.players{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.pc .hd{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.pc .nm{font-size:16px;font-weight:700}
.badge{font-size:11px;padding:1px 7px;border-radius:6px;border:1px solid rgba(183,156,255,.45);color:var(--violet);margin-left:6px;font-weight:500}
.kv{display:grid;grid-template-columns:70px minmax(0,1fr);gap:9px 10px;align-items:center;font-size:13px}
.kv .k{color:var(--ink3);font-size:12.5px}
.stars{letter-spacing:2px;color:var(--line2)}.stars b{color:var(--amber);font-weight:400}
.lamps{display:flex;gap:6px}
.lamp{width:14px;height:18px;border-radius:7px/9px;background:#2a3147;border:1px solid var(--line2)}
.lamp.lit{background:radial-gradient(circle at 50% 40%,#ffe3a3,#f2a541 60%,#b9531f);border-color:#f2a541;box-shadow:0 0 9px rgba(242,165,65,.5)}
.mems{display:flex;gap:4px;align-items:center}
.mem{width:12px;height:12px;transform:rotate(45deg);border-radius:2px;background:#2a3147;border:1px solid var(--line2)}
.mem.has{background:var(--violet);border-color:var(--violet);box-shadow:0 0 6px rgba(183,156,255,.5)}
.mem.pend{background:transparent;border:1px dashed var(--violet)}
.prog{position:relative;height:8px;background:var(--line);border-radius:5px;margin:6px 0 2px}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,#c9761f,var(--amber))}
.prog s{position:absolute;top:-3px;width:2px;height:14px;background:var(--line2)}
.prog s.ok{background:var(--amber2)}
.dim{color:var(--ink3)}
.empty{color:var(--ink3);text-align:center;padding:30px 0}
.on-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--jade);box-shadow:0 0 6px var(--jade);margin-right:5px}
footer{color:var(--ink3);font-size:12px;text-align:center;margin-top:24px}
.tab{display:none}.tab.act{display:block}
@media (max-width:640px){
  .wrap{padding:0 12px 40px}
  header{padding:16px 0 12px}
  h1{font-size:19px}
  .players,.boards{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="lantern"><i></i></div>
    <div><h1>深夜食堂 · 玩家榜</h1><div class="sub" id="upd">加载中…</div></div>
    <span class="spacer"></span>
    <span class="pill" id="srv"><span class="dot"></span><span>—</span></span>
  </header>
  <div class="tabs">
    <button class="act" data-t="rank">排行榜</button>
    <button data-t="prog">大家的进度</button>
  </div>

  <section class="tab act" id="t-rank">
    <div class="card"><h3>冠军墙<span class="r" style="color:var(--ink3)">谁拿的第一最多</span></h3><div id="wall"></div></div>
    <div class="chips" id="cats"></div>
    <div class="grid boards" id="boards"></div>
  </section>

  <section class="tab" id="t-prog">
    <div class="grid players" id="players"></div>
  </section>

  <footer>数据由服务器每 10 分钟自动更新 · 原版统计跟着存档走，最多再晚 5 分钟</footer>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const fmt = n => n == null || isNaN(n) ? '—' : Math.round(n).toLocaleString('zh-CN');
const km = cm => cm >= 100000 ? (cm / 100000).toFixed(cm >= 1e7 ? 0 : 1) + ' km' : Math.round(cm / 100) + ' m';
function dur(ms) {
  if (ms == null || ms < 0) return '—';
  const m = Math.floor(ms / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (d > 0) return d + ' 天 ' + (h % 24) + ' 小时';
  if (h > 0) return h + ' 小时 ' + (m % 60) + ' 分';
  return m + ' 分钟';
}
function ago(t) {
  const s = (Date.now() - t) / 1000;
  if (s < 90) return '刚刚';
  if (s < 3600) return Math.round(s / 60) + ' 分钟前';
  if (s < 86400) return Math.round(s / 3600) + ' 小时前';
  return Math.round(s / 86400) + ' 天前';
}
const LAMPS = ['炊烟', '炉火', '林中', '云上', '尽头', '灾变', '群星'];
const EARN_MS = [100, 1000, 3000, 5000, 7500, 10000, 15000, 25000];
let D = null, cat = 'all';
try { cat = localStorage.getItem('shenyeCat') || 'all'; } catch (e) {}

const S = (p, k) => p.stats && p.stats[k] != null ? p.stats[k] : null;
const lampN = p => (p.lamps || []).filter(Boolean).length;
const CATS = [['all', '全部'], ['biz', '经营'], ['prog', '进度'], ['fight', '战斗'], ['move', '探索'], ['life', '生活'], ['time', '在线']];
const BOARDS = [
  {c: 'biz', t: '累计营收', nick: '深夜食堂之星', v: p => p.earn, f: fmt},
  {c: 'biz', t: '今日营收', nick: '今日店长', v: p => p.todayEarn, f: v => '+' + fmt(v)},
  {c: 'biz', t: '餐厅星级', nick: '米其林', v: p => p.star, f: v => v + ' 星'},
  {c: 'biz', t: '接单数', nick: '接单狂魔', v: p => p.rest && p.rest.accepted, f: v => fmt(v) + ' 单'},
  {c: 'biz', t: '外卖单数', nick: '金牌骑手', v: p => p.rest && p.rest.delivery, f: v => fmt(v) + ' 单'},
  {c: 'biz', t: '到店客人', nick: '人气老板', v: p => p.rest && p.rest.walkIn, f: v => fmt(v) + ' 位'},
  {c: 'biz', t: '商店消费', nick: '剁手党', v: p => p.spent, f: fmt},
  {c: 'prog', t: '主线进度', nick: '点灯人', v: p => lampN(p) + (p.feast ? 1 : 0) + (p.bill ? 1 : 0) + (p.home ? 1 : 0), f: v => v <= 7 ? v + ' 盏灯' : (['终章', '结清账单', '已归乡'][v - 8] || v)},
  {c: 'prog', t: 'Boss 见证', nick: '屠龙者', v: p => (p.bosses || []).length, f: v => v + ' 个'},
  {c: 'prog', t: '成就积分', nick: '成就猎人', v: p => p.adv && p.adv.pts, f: v => v + ' 分'},
  {c: 'prog', t: '记忆碎片', nick: '拾忆者', v: p => p.mem, f: v => v + ' / 7'},
  {c: 'fight', t: '击杀生物', nick: '战神', v: p => S(p, 'mobKills'), f: fmt},
  {c: 'fight', t: '造成伤害', nick: '输出担当', v: p => S(p, 'dmgDealt'), f: v => fmt(v / 10) + ' ♥'},
  {c: 'fight', t: '承受伤害', nick: '人肉沙包', v: p => S(p, 'dmgTaken'), f: v => fmt(v / 10) + ' ♥'},
  {c: 'fight', t: '死亡次数', nick: '复活点常客', v: p => S(p, 'deaths'), f: v => v + ' 次'},
  {c: 'fight', t: '最久没死', nick: '不死之身', v: p => S(p, 'sinceDeath'), f: v => dur(v * 50)},
  {c: 'move', t: '步行距离', nick: '暴走族', v: p => S(p, 'walkCm'), f: km},
  {c: 'move', t: '飞行距离', nick: '天空之子', v: p => S(p, 'flyCm'), f: km},
  {c: 'move', t: '游泳距离', nick: '浪里白条', v: p => S(p, 'swimCm'), f: km},
  {c: 'move', t: '骑乘距离', nick: '老司机', v: p => S(p, 'rideCm'), f: km},
  {c: 'move', t: '跳跃次数', nick: '兔子', v: p => S(p, 'jumps'), f: fmt},
  {c: 'life', t: '挖掘方块', nick: '矿工', v: p => S(p, 'mined'), f: fmt},
  {c: 'life', t: '合成物品', nick: '工匠', v: p => S(p, 'crafted'), f: fmt},
  {c: 'life', t: '使用 / 放置', nick: '建筑师', v: p => S(p, 'placed'), f: fmt},
  {c: 'life', t: '钓鱼', nick: '钓鱼佬', v: p => S(p, 'fished'), f: v => v + ' 条'},
  {c: 'life', t: '繁殖动物', nick: '饲养员', v: p => S(p, 'animalsBred'), f: v => v + ' 次'},
  {c: 'life', t: '村民交易', nick: '奸商', v: p => S(p, 'tradedVillager'), f: v => v + ' 次'},
  {c: 'life', t: '睡觉', nick: '早睡早起', v: p => S(p, 'sleep'), f: v => v + ' 次'},
  {c: 'time', t: '总在线', nick: '肝帝', v: p => p.onlineTotal, f: dur},
  {c: 'time', t: '今日在线', nick: '今日最肝', v: p => p.onlineToday, f: dur},
  {c: 'time', t: '近 7 天在线', nick: '周榜肝帝', v: p => p.onlineWeek, f: dur}
];
const ava = (n, size) => `<div class="ava" style="width:${size}px;height:${size}px">${esc(n[0].toUpperCase())}<img src="https://mc-heads.net/avatar/${encodeURIComponent(n)}/${size}" alt="" onerror="this.remove()" onload="this.parentNode.firstChild.textContent=''"></div>`;

function renderRank() {
  const ps = D.players || [];
  $('cats').innerHTML = CATS.map(c => `<button class="chip ${cat === c[0] ? 'act' : ''}" data-c="${c[0]}">${c[1]}</button>`).join('');
  const champs = {};
  const cards = BOARDS.map(b => {
    const rows = ps.map(p => ({p, v: b.v(p)})).filter(r => r.v != null && r.v > 0).sort((a, c) => c.v - a.v);
    if (rows.length) (champs[rows[0].p.name] = champs[rows[0].p.name] || []).push(b.nick);
    return {b, rows};
  });
  const wall = Object.keys(champs).sort((a, b) => champs[b].length - champs[a].length);
  $('wall').innerHTML = wall.length ? '<div class="wall">' + wall.map(n => `<div>${ava(n, 38)}<div style="min-width:0;flex:1">
    <div style="display:flex;align-items:baseline;gap:8px"><b>${esc(n)}</b><span class="cnt">${champs[n].length}</span><span class="dim" style="font-size:12px">个第一</span></div>
    <div class="tags">${champs[n].map(t => `<span>${esc(t)}</span>`).join('')}</div></div></div>`).join('') + '</div>' : '<div class="empty">还没有数据</div>';
  const shown = cards.filter(x => cat === 'all' || x.b.c === cat);
  const empty = shown.filter(x => !x.rows.length).map(x => x.b.t);
  const medal = ['🥇', '🥈', '🥉'];
  $('boards').innerHTML = shown.filter(x => x.rows.length).map(({b, rows}) => `<div class="card"><h3>${esc(b.t)}<span class="r">${esc(rows[0].p.name)} · ${esc(b.nick)}</span></h3>
    ${rows.slice(0, 5).map((r, i) => `<div class="row ${i ? '' : 'first'}"><span class="md">${medal[i] || '<span class="dim" style="font-size:12px">' + (i + 1) + '</span>'}</span><span class="nm">${esc(r.p.name)}</span><span class="v">${esc(b.f(r.v))}</span><span class="tr"><i style="width:${r.v / rows[0].v * 100}%"></i></span></div>`).join('')}</div>`).join('')
    + (empty.length ? `<div class="dim" style="grid-column:1/-1;font-size:12.5px">还没人上榜：${empty.map(esc).join('、')}</div>` : '');
}

function renderPlayers() {
  const ps = (D.players || []).slice().sort((a, b) => (b.online - a.online) || (b.earn || 0) - (a.earn || 0));
  if (!ps.length) { $('players').innerHTML = '<div class="card empty">还没有玩家数据</div>'; return; }
  $('players').innerHTML = ps.map(p => {
    const earn = p.earn || 0, nextMs = EARN_MS.find(v => v > earn);
    const ticks = EARN_MS.map(v => `<s class="${earn >= v ? 'ok' : ''}" style="left:calc(${v / 250}% - 1px)"></s>`).join('');
    let mems = '';
    for (let i = 1; i <= 7; i++) {
      const pend = (p.memPending || []).includes(i), lit = p.lamps && p.lamps[i - 1];
      mems += `<span class="mem ${pend ? 'pend' : lit ? 'has' : ''}" title="记忆碎片 ${i}${pend ? '：营收还不够，暂时没发' : ''}"></span>`;
    }
    const n = lampN(p);
    const stage = p.home ? '<span style="color:var(--violet)">已经回到零号星</span>'
      : p.bill ? '结清了账单，就差亲手把归乡宴交给阿零' : p.feast ? '七盏灯全亮，在做终章'
      : n ? `已点亮 ${n} 盏灯，下一盏：${LAMPS[n] || '终章'}` : (p.otcFirst ? '餐厅开张了，在点第一盏灯' : '刚到深夜食堂');
    let stars = ''; for (let i = 1; i <= 8; i++) stars += i <= (p.star || 0) ? '<b>★</b>' : '★';
    return `<div class="card pc">
      <div class="hd">${ava(p.name, 46)}<div style="min-width:0">
        <div class="nm">${esc(p.name)}${p.home ? '<span class="badge">已归乡</span>' : ''}</div>
        <div class="sub">${p.online ? '<span class="on-dot"></span>正在玩' : '上次在线 ' + ago(p.lastSeen)}</div></div></div>
      <div class="kv">
        <div class="k">进度</div><div>${stage}</div>
        <div class="k">餐厅</div><div><span class="stars">${stars}</span> <span class="dim">${p.star || 0} 星</span></div>
        <div class="k">累计营收</div><div><b>${fmt(earn)}</b> <span class="dim">/ 25,000${nextMs ? ' · 下一档 ' + fmt(nextMs) : ' · 满了'}</span><div class="prog"><i style="width:${Math.min(100, earn / 250)}%"></i>${ticks}</div></div>
        <div class="k">七盏灯</div><div class="lamps">${LAMPS.map((t, i) => `<span class="lamp ${p.lamps && p.lamps[i] ? 'lit' : ''}" title="第${i + 1}盏灯 · ${t}"></span>`).join('')}</div>
        <div class="k">记忆碎片</div><div class="mems">${mems}<span class="dim" style="margin-left:8px">${p.mem || 0} / 7</span></div>
        <div class="k">Boss</div><div>${(p.bosses || []).length ? `<b style="color:var(--amber2)">${p.bosses.length}</b> <span class="dim">/ ${D.bossTotal || 25} · ${p.bosses.slice(-4).map(esc).join('、')}</span>` : '<span class="dim">还没有</span>'}</div>
        <div class="k">成就</div><div>${p.adv ? `${p.adv.n} 个 · <b style="color:var(--amber2)">${p.adv.pts}</b> 分` : '—'}</div>
        <div class="k">在线</div><div>${dur(p.onlineTotal)} <span class="dim">· 今天 ${dur(p.onlineToday)}</span></div>
      </div></div>`;
  }).join('');
}

function render() {
  const live = D.server && D.server.online && Date.now() - D.updated < 40 * 60000;
  const s = $('srv');
  s.className = 'pill' + (live ? ' on' : '');
  s.lastElementChild.textContent = live ? `服务器开着 · ${D.server.players} 人在线` : '服务器休息中';
  $('upd').textContent = '更新于 ' + ago(D.updated) + (live ? '' : (Date.now() - D.updated > 40 * 60000 ? '（服务器或面板没开，数据停在这里）' : ''));
  renderRank();
  renderPlayers();
}

async function load() {
  try {
    const r = await fetch('data.json?t=' + Date.now(), {cache: 'no-store'});
    if (!r.ok) throw new Error(r.status);
    D = await r.json();
    render();
  } catch (e) {
    if (!D) $('upd').textContent = '数据还没上传，等服务器面板第一次同步';
  }
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('act', x === b));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('act', t.id === 't-' + b.dataset.t));
});
$('cats').onclick = e => {
  const b = e.target.closest('[data-c]'); if (!b) return;
  cat = b.dataset.c; try { localStorage.setItem('shenyeCat', cat); } catch (x) {}
  renderRank();
};
load();
setInterval(load, 120000);
setInterval(() => { if (D) render(); }, 30000);
</script>
</body>
</html>
