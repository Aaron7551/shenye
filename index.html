<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>深夜食堂 · 玩家榜</title>
<meta name="description" content="深夜食堂服务器的排行榜和每个人的主线进度，每 10 分钟更新一次">
<style>
/* =====================================================================
   深夜食堂 · 玩家榜 —— v2 视觉层（2026-10-27）
   和面板同一套 token；只换皮，不动 HTML 结构和脚本。
   ===================================================================== */
:root{
  --bg:#080a10; --bg2:#0b0e15;
  --card:#101521; --card2:#141a27;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.11);
  --ink:#eceae4; --ink2:#a3aab9; --ink3:#6b7385;
  --amber:#f0a44b; --amber2:#ffc978; --amber-soft:rgba(240,164,75,.12);
  --red:#e0674f; --jade:#48c9a4; --jade-soft:rgba(72,201,164,.12);
  --violet:#b79cff; --sky:#7aa2ff;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,ui-monospace,monospace;
  --sans:"Segoe UI Variable Text","Segoe UI","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --hair:rgba(255,255,255,.06);
  --e2:inset 0 1px 0 rgba(255,255,255,.06), 0 18px 40px -28px rgba(0,0,0,.9);
  --ease:cubic-bezier(.22,.68,.3,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;background:var(--bg);color:var(--ink);
  font:13px/1.65 var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(900px 500px at 78% -180px, rgba(240,164,75,.15), transparent 62%),
    radial-gradient(680px 460px at 2% 106%, rgba(122,162,255,.07), transparent 62%),
    radial-gradient(560px 260px at 50% 0%, rgba(255,255,255,.03), transparent 70%);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.028;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
::selection{background:rgba(240,164,75,.28)}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:#1d2433;border-radius:99px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}

.wrap{max-width:1120px;margin:0 auto;padding:0 24px 64px}

/* ---------- 头部 ---------- */
header{display:flex;align-items:center;gap:13px;padding:28px 0 20px;flex-wrap:wrap}
.lantern{width:28px;height:34px;position:relative;flex:none}
.lantern i{
  position:absolute;left:3px;top:5px;width:22px;height:24px;border-radius:12px/14px;
  background:radial-gradient(circle at 50% 42%,#ffe0a6,#f0a44b 52%,#a8411a);
  box-shadow:0 0 24px rgba(240,164,75,.55),0 0 60px rgba(240,164,75,.22);
}
.lantern::before,.lantern::after{content:"";position:absolute;left:9px;width:10px;height:3px;border-radius:2px;background:#3a2a1c}
.lantern::before{top:2px}.lantern::after{bottom:2px}
h1{margin:0;font-size:21px;font-weight:650;letter-spacing:.14em;line-height:1.2}
.sub{color:var(--ink3);font-size:11.5px;letter-spacing:.02em;margin-top:5px}
.spacer{flex:1}
.pill{
  display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 12px;border-radius:99px;
  font-size:12px;border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--ink2);
}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--ink3)}
.pill.on{border-color:rgba(72,201,164,.32);background:rgba(72,201,164,.10);color:#9fe6d1}
.pill.on .dot{background:var(--jade);box-shadow:0 0 0 3px rgba(72,201,164,.14),0 0 10px var(--jade)}

/* ---------- 分段控件 ---------- */
.tabs{
  display:flex;gap:4px;width:fit-content;margin:2px 0 18px;padding:4px;
  border-radius:12px;background:rgba(255,255,255,.035);border:1px solid var(--hair);
}
.tabs button{
  height:30px;padding:0 16px;border-radius:9px;border:0;background:none;
  color:var(--ink3);font-size:12.5px;letter-spacing:.02em;transition:.16s var(--ease);
}
.tabs button:hover{color:var(--ink2)}
.tabs button.act{background:rgba(255,255,255,.075);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.4)}

/* ---------- 卡片 ---------- */
.card{
  background:var(--card);
  background-image:linear-gradient(180deg,rgba(255,255,255,.032),rgba(255,255,255,0) 44%);
  border:0;border-radius:16px;padding:18px 20px;min-width:0;
  box-shadow:var(--e2);
}
.card h3{
  margin:0 0 14px;font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--ink);
  display:flex;gap:10px;align-items:baseline;
}
.card h3 .r{margin-left:auto;font-weight:400;font-size:11.5px;color:var(--ink3)}
.grid{display:grid;gap:14px}
.boards{grid-template-columns:repeat(auto-fill,minmax(258px,1fr))}

/* ---------- 排行行 ---------- */
.row{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 0;font-size:12.5px}
.row .md{text-align:center;font-size:12px}
.row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.row .v{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:11.5px}
.row.first .nm{color:#ffd9a3;font-weight:600}
.row .tr{grid-column:2/4;height:4px;background:rgba(255,255,255,.05);border-radius:99px;overflow:hidden;margin-top:-1px}
.row .tr i{display:block;height:100%;min-width:3px;border-radius:99px;background:linear-gradient(90deg,rgba(240,164,75,.45),var(--amber))}

/* ---------- 分类 chip ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 14px}
.chip{
  border:1px solid var(--line2);background:rgba(255,255,255,.025);padding:5px 12px;border-radius:99px;
  cursor:pointer;font-size:12px;color:var(--ink2);transition:.15s var(--ease);
}
.chip:hover{border-color:rgba(255,255,255,.18);color:var(--ink)}
.chip.act{background:rgba(240,164,75,.12);border-color:rgba(240,164,75,.4);color:#ffd9a3}

/* ---------- 冠军墙 ---------- */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.wall>div{
  display:flex;gap:11px;align-items:center;background:rgba(255,255,255,.022);
  border:1px solid var(--hair);border-radius:12px;padding:11px 13px;
}
.cnt{font:600 22px var(--mono);color:var(--amber2);line-height:1;letter-spacing:-.02em}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tags span{
  font-size:10.5px;padding:1px 7px;border-radius:5px;
  background:rgba(240,164,75,.10);color:#ffd9a3;border:1px solid rgba(240,164,75,.22);
}

/* ---------- 头像 ---------- */
.ava{
  width:40px;height:40px;border-radius:10px;background:var(--card2);flex:none;
  display:grid;place-items:center;font-weight:650;font-size:16px;color:var(--amber);
  overflow:hidden;image-rendering:pixelated;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
}
.ava img{width:100%;height:100%}

/* ---------- 玩家卡 ---------- */
.players{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.pc .hd{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.pc .nm{font-size:15px;font-weight:650;display:flex;align-items:center;gap:8px}
.badge{
  font-size:10.5px;padding:1px 7px;border-radius:5px;border:1px solid rgba(183,156,255,.4);
  color:var(--violet);font-weight:500;background:rgba(183,156,255,.10);
}
.kv{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px 12px;align-items:center;font-size:12.5px}
.kv .k{color:var(--ink3);font-size:11.5px}
.stars{letter-spacing:2px;color:#3a4152;font-size:14px}
.stars b{color:var(--amber);font-weight:400}
.lamps{display:flex;gap:6px}
.lamp{width:14px;height:18px;border-radius:7px/9px;background:#222a3a;border:1px solid var(--line2)}
.lamp.lit{
  background:radial-gradient(circle at 50% 40%,#ffe3a3,#f0a44b 60%,#b9531f);
  border-color:var(--amber);box-shadow:0 0 10px rgba(240,164,75,.5);
}
.mems{display:flex;gap:4px;align-items:center}
.mem{width:12px;height:12px;transform:rotate(45deg);border-radius:2px;background:#222a3a;border:1px solid var(--line2)}
.mem.has{background:var(--violet);border-color:var(--violet);box-shadow:0 0 6px rgba(183,156,255,.5)}
.mem.pend{background:transparent;border:1px dashed var(--violet)}
.prog{position:relative;height:7px;background:rgba(255,255,255,.06);border-radius:99px;margin:8px 0 3px}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#c07a2a,var(--amber))}
.prog s{position:absolute;top:-3px;width:2px;height:13px;background:var(--line2);border-radius:1px}
.prog s.ok{background:var(--amber2)}

/* ---------- 近 24 小时在线时间轴 ---------- */
.tl-row{display:grid;grid-template-columns:88px minmax(0,1fr) 62px;gap:12px;align-items:center;padding:5px 0;font-size:12px}
.tl-row .nm{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-track{position:relative;height:16px;border-radius:5px;background:rgba(255,255,255,.05);overflow:hidden}
.tl-track i{position:absolute;top:3px;bottom:3px;border-radius:3px;background:linear-gradient(180deg,#5c7fd6,#4a6cbd);opacity:.92}
.tl-track i.live{background:linear-gradient(180deg,var(--jade),#37a98a);box-shadow:0 0 12px rgba(72,201,164,.35)}
.tl-row .v{text-align:right;color:var(--ink3);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tl-axis{display:grid;grid-template-columns:88px minmax(0,1fr) 62px;gap:12px;margin-top:8px;height:12px;font-size:10px;color:#4d5464}
.tl-axis i{display:block}
.tl-axis div{position:relative;height:12px}
.tl-axis span{position:absolute;transform:translateX(-50%);white-space:nowrap}

/* ---------- 杂项 ---------- */
.dim{color:var(--ink3)}
.empty{color:var(--ink3);text-align:center;padding:30px 0;font-size:12.5px}
.on-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--jade);box-shadow:0 0 6px var(--jade);margin-right:6px;vertical-align:1px}
footer{color:#4d5464;font-size:11px;text-align:center;margin-top:30px;letter-spacing:.02em}
.tab{display:none}
.tab.act{display:block;animation:fadein .18s var(--ease)}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}

@media (max-width:640px){
  .wrap{padding:0 14px 44px}
  header{padding:20px 0 14px;gap:11px}
  h1{font-size:18px}
  .players,.boards,.wall{grid-template-columns:1fr}
  .kv{grid-template-columns:64px minmax(0,1fr);gap:9px 10px}
  .card{padding:15px 16px}
  .tabs button{height:28px;padding:0 13px}
  .tl-row,.tl-axis{grid-template-columns:64px minmax(0,1fr) 52px;gap:9px}
}
/* ---------- 餐厅与经济（行情面板） ---------- */
.up{color:var(--red)}       /* 涨用红，跌用绿（国内习惯） */
.dn{color:var(--jade)}
.flat{color:var(--ink3)}
.chg{font-variant-numeric:tabular-nums;white-space:nowrap}

.ticker{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--hair);
  border:1px solid var(--hair);border-radius:14px;overflow:hidden;margin-bottom:14px}
.ti{background:var(--card);padding:10px 14px;min-width:0}
.ti .k{display:block;font-size:10px;letter-spacing:.11em;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti .v{display:block;font-size:19px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.3;margin-top:1px}
.ti .chg{display:block;font-size:10.5px}
.note{font-size:10.5px;color:#545c6b;margin:-6px 2px 14px;line-height:1.5}

.eco-main{grid-template-columns:minmax(0,1fr) 300px}
.chart-hd{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.chart-hd h3{margin-bottom:9px}
.chart-hd h3 .r{margin-left:8px}
.quote{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.quote b{font-size:27px;font-weight:650;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.quote .chg{font-size:12.5px}
.quote .dim{margin-left:6px}
.seg{display:flex;gap:2px;padding:3px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid var(--hair);margin-left:auto}
.seg button{height:25px;padding:0 11px;border-radius:7px;font-size:11.5px;color:var(--ink3);transition:.15s var(--ease);white-space:nowrap}
.seg button:hover{color:var(--ink2)}
.seg button.act{background:rgba(255,255,255,.085);color:var(--ink)}
.seg.sm button{height:23px;padding:0 9px;font-size:11px}
.chart-box{position:relative;margin-top:10px}
#econChart{width:100%;height:248px;display:block}
.chart-tip{position:absolute;left:0;top:0;pointer-events:none;padding:5px 9px;border-radius:8px;font-size:11px;
  background:rgba(10,14,21,.95);border:1px solid var(--line2);box-shadow:0 10px 24px rgba(0,0,0,.55);
  opacity:0;transition:opacity .12s;white-space:nowrap;transform:translate(-50%,-128%);z-index:3}
.chart-tip b{font-variant-numeric:tabular-nums}
.chart-ft{display:flex;gap:18px;flex-wrap:wrap;font-size:11px;color:var(--ink3);margin-top:6px}
.chart-ft b{color:var(--ink2);font-weight:550;font-variant-numeric:tabular-nums}

.tape-row{display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:7px 0;border-top:1px solid var(--hair);font-size:12px}
.tape-row:first-child{border-top:0;padding-top:0}
.tape-row .k{color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tape-row .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.tape-row .bar{grid-column:1/-1;height:3px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden}
.tape-row .bar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#b06a1e,var(--amber))}

.card-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.card-row h3{margin:0;flex:1 1 auto}
.card-row .seg{margin-left:auto}

.two{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font-size:10.5px;font-weight:500;letter-spacing:.08em;color:var(--ink3);text-align:left;padding:0 9px 8px 0;border-bottom:1px solid var(--hair);white-space:nowrap}
.tbl td{padding:8px 9px 8px 0;border-bottom:1px solid var(--hair);color:var(--ink2);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl th.r,.tbl td.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl td.name{color:var(--ink)}
.tbl td .sub{display:block;font-size:10.5px;line-height:1.3;color:var(--ink3);margin:1px 0 0}
.rank-n{display:inline-flex;width:19px;height:19px;align-items:center;justify-content:center;border-radius:5px;
  font-size:10px;background:rgba(255,255,255,.05);color:var(--ink3);font-variant-numeric:tabular-nums}
.rank-n.top{background:rgba(240,164,75,.16);color:var(--amber2)}
.share{min-width:124px}
.share .trk{display:inline-block;width:64px;height:4px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden;vertical-align:1px}
.share .trk i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--amber),#a1651c)}
.share b{margin-left:7px;font-weight:400;font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}

.spark{width:100%;height:36px;display:block}
.trend{width:100%;height:190px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--ink3);margin-top:8px}
.legend i{display:inline-block;width:12px;height:2px;vertical-align:3px;margin-right:5px}
.hbar{display:grid;grid-template-columns:minmax(70px,118px) minmax(0,1fr) 74px;gap:9px;align-items:center;font-size:12px;padding:4px 0}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.hbar .tr{height:8px;background:rgba(255,255,255,.05);border-radius:5px;overflow:hidden}
.hbar .tr i{display:block;height:100%;min-width:2px;border-radius:5px;background:var(--amber)}
.hbar .v{text-align:right;font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums}
@media (max-width:900px){
  .eco-main{grid-template-columns:1fr}
  .ticker{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ti:nth-child(4),.ti:nth-child(5){display:none}
}
@media (max-width:760px){
  .two,.three{grid-template-columns:1fr}
  .ticker{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ti:nth-child(3){display:none}
  #econChart{height:200px}
  .quote b{font-size:22px}
  .chart-hd{flex-direction:column;align-items:stretch}
  .seg{margin-left:0}
  .card-row .seg{margin-left:0}
  #restTable th:nth-child(5),#restTable td:nth-child(5),
  #restTable th:nth-child(6),#restTable td:nth-child(6){display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="lantern"><i></i></div>
    <div><h1>深夜食堂 · 玩家榜</h1><div class="sub" id="upd">加载中…</div></div>
    <span class="spacer"></span>
    <span class="pill" id="srv"><span class="dot"></span><span>—</span></span>
  </header>
  <div class="tabs">
    <button class="act" data-t="rank">排行榜</button>
    <button data-t="prog">大家的进度</button>
    <button data-t="eco">餐厅与经济</button>
  </div>

  <section class="tab act" id="t-rank">
    <div class="card" style="margin-bottom:14px">
      <h3>近 24 小时谁在线<span class="r" id="tlInfo"></span></h3>
      <div id="online24"></div>
    </div>
    <div class="card"><h3>冠军墙<span class="r" style="color:var(--ink3)">谁拿的第一最多</span></h3><div id="wall"></div></div>
    <div class="chips" id="cats"></div>
    <div class="grid boards" id="boards"></div>
  </section>

  <section class="tab" id="t-prog">
    <div class="grid players" id="players"></div>
  </section>

  <section class="tab" id="t-eco">
    <div class="ticker" id="econTicker"></div>
    <div class="note">综合指数是三位数自己捏的：累计营收 5 : 流通币 3 : 商店成交 2 加权，起点 1000，只用来一眼看冷热；涨用红、跌用绿。</div>

    <div class="grid eco-main">
      <div class="card">
        <div class="chart-hd">
          <div>
            <h3>全服经济走势<span class="r" id="chartRange"></span></h3>
            <div class="quote"><b id="quoteVal">—</b><span id="quoteChg"></span></div>
          </div>
          <div class="seg" id="chartTabs">
            <button class="act" data-s="e">累计营收</button>
            <button data-s="c">流通币</button>
            <button data-s="s">商店成交</button>
          </div>
        </div>
        <div class="chart-box">
          <svg id="econChart" viewBox="0 0 820 260" preserveAspectRatio="none"></svg>
          <div class="chart-tip" id="chartTip"></div>
        </div>
        <div class="chart-ft" id="chartFt"></div>
      </div>
      <div class="card">
        <h3>盘口<span class="r">实时汇总</span></h3>
        <div class="tape" id="tapeRows"></div>
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="card-row">
        <h3>餐厅行情<span class="r" id="restInfo"></span></h3>
        <div class="seg sm" id="restSort">
          <button class="act" data-k="profit">按营收</button>
          <button data-k="level">按评级</button>
          <button data-k="accepted">按单量</button>
        </div>
      </div>
      <div class="tbl-wrap"><table class="tbl" id="restTable"></table></div>
    </div>

<script>

const ava = (n, size) => `<div class="ava" style="width:${size}px;height:${size}px">${esc(n[0].toUpperCase())}<img src="https://mc-heads.net/avatar/${encodeURIComponent(n)}/${size}" alt="" onerror="this.remove()" onload="this.parentNode.firstChild.textContent=''"></div>`;

// ---------- 餐厅与经济（行情面板） ----------
const PALETTE = ['#f2a541', '#7fa8ff', '#6fc49a', '#b79cff', '#e0614a', '#5fd0d6', '#f07fb5', '#c9d36a'];
const COUNTERS = {leisure:'休闲柜台',t1:'工坊柜台',t2:'物流柜台',t3:'智控柜台',craft:'手作与摆件',redstone:'红石与电脑',tools:'工具柜台'};

const hhmm = t => { const d = new Date(t); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const hmof = t => { const d = new Date(t); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };

const ECON_S = {

};
// 线按 24 小时整体涨跌上色：涨红、跌绿、不动灰（国内习惯；和 --red / --jade / --ink3 一致）
const UP_C = '#e0614a', DN_C = '#48c9a4', FLAT_C = '#6b7385';
let ECON_K = 'e', REST_SORT = 'profit', ECON_PTS = [];

function sparkSvg(vals, color) {
  if (vals.length < 2) return '';
  const W = 240, H = 36, pad = 2, n = vals.length;
  const mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals), sp = (mx - mn) || 1;
  let d = '';
  vals.forEach((v, i) => {
    const x = pad + i / (n - 1) * (W - pad * 2), y = H - pad - (v - mn) / sp * (H - pad * 2);
    d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
  });
  const area = d + ' L' + (W - pad) + ' ' + (H - pad) + ' L' + pad + ' ' + (H - pad) + ' Z';
  const gid = 'sg' + color.replace('#', '');
  return `<svg class="spark" viewBox="0 0 240 36" preserveAspectRatio="none"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".28"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.4" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
function hbars(rows, f, color) {
  if (!rows.length) return '<div class="empty">还没有数据</div>';
  const max = Math.max.apply(null, rows.map(r => r.v)) || 1;
  return rows.map(r => `<div class="hbar"><span class="nm" title="${esc(r.n)}">${esc(r.n)}</span><span class="tr"><i style="width:${r.v / max * 100}%;${r.c || color ? 'background:' + (r.c || color) : ''}"></i></span><span class="v">${esc(f(r.v))}</span></div>`).join('');
}
function renderEarnTrend() {
  const svg = $('earnChart');
  if (!svg) return;

  const names = [...new Set(pts.flatMap(p => Object.keys(p.e || {})))];
  if (pts.length < 2 || !names.length) {
    svg.innerHTML = '<text x="400" y="95" text-anchor="middle" fill="#6b7385" font-size="13">有人开店赚钱以后，每小时记一个点</text>';
    $('earnLegend').innerHTML = '';
    return;
  }
  const W = 800, H = 190, P = {l: 46, r: 12, t: 10, b: 22};
  const maxV = Math.max(100, ...pts.flatMap(p => Object.values(p.e || {})));
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  const x = t => P.l + (t - t0) / Math.max(1, t1 - t0) * (W - P.l - P.r);
  const y = v => P.t + (1 - v / maxV) * (H - P.t - P.b);
  let g = '';
  [0, .5, 1].forEach(f => {
    g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(maxV * f)}" y2="${y(maxV * f)}" stroke="rgba(255,255,255,.07)"/><text x="${P.l - 6}" y="${y(maxV * f) + 4}" text-anchor="end" fill="#6b7385" font-size="10">${fmt(maxV * f)}</text>`;
  });
  names.forEach((n, i) => {
    const c = PALETTE[i % PALETTE.length];
    g += `<path d="${pts.map((p, j) => (j ? 'L' : 'M') + x(p.t).toFixed(1) + ' ' + y((p.e && p.e[n]) || 0).toFixed(1)).join('')}" fill="none" stroke="${c}" stroke-width="2"/>`;
  });
  svg.innerHTML = g;
  $('earnLegend').innerHTML = names.map((n, i) => `<span><i style="background:${PALETTE[i % PALETTE.length]}"></i>${esc(n)}</span>`).join('');
}

/* ---- 24 小时序列与涨跌 ---- */
function econHist() { return (D.econHist || []).filter(p => p && p.c != null); }
function econVals(k) { return econHist().map(p => Number(p[k]) || 0); }
function chgOf(vals) {
  if (!vals || vals.length < 2) return {ok: false};
  const a = vals[0], b = vals[vals.length - 1];
  return {ok: true, cur: b, d: b - a, p: a ? (b - a) / a * 100 : null};
}
function chgHtml(c) {
  if (!c || !c.ok) return '<span class="chg flat">—</span>';
  if (!c.d) return '<span class="chg flat">持平</span>';
  const cls = c.d > 0 ? 'up' : 'dn';
  const sign = c.d > 0 ? '+' : '';
  const pct = c.p == null ? '' : ' · ' + sign + (Math.round(c.p * 10) / 10) + '%';
  return `<span class="chg ${cls}">${sign}${fmt(c.d)}${pct}</span>`;
}
// 综合指数：营收 5 : 流通币 3 : 商店成交 2，起点 1000（只是把三个数揉成一个走势，不是官方数据）
function econIndex() {
  const s = econHist();
  if (s.length < 2) return [];
  const e0 = Number(s[0].e) || 0, c0 = Number(s[0].c) || 0, s0 = Number(s[0].s) || 0;
  return s.map(p => {
    const de = e0 ? ((Number(p.e) || 0) - e0) / e0 : 0;
    const dc = c0 ? ((Number(p.c) || 0) - c0) / c0 : 0;
    const ds = s0 ? ((Number(p.s) || 0) - s0) / s0 : 0;
    return 1000 * (1 + 0.5 * de + 0.3 * dc + 0.2 * ds);
  });
}

/* ---- 顶部行情条 ---- */
function renderTicker() {

    {k: '累计营收', v: fmt(e.totalEarn), c: chgOf(econVals('e')), tip: '所有玩家亲手完成的单'},

  ];
  el.innerHTML = items.map(i => `<div class="ti" title="${esc(i.tip)}"><span class="k">${i.k}</span><span class="v">${i.v}</span>${i.c ? chgHtml(i.c) : '<span class="chg flat">' + esc(i.tip) + '</span>'}</div>`).join('');
}

/* ---- 主走势图 ---- */
function drawEconChart() {
  const svg = $('econChart'); if (!svg) return;
  const hist = econHist(), meta = ECON_S[ECON_K], vals = econVals(ECON_K);
  const e = D.economy || {};
  const fallback = ECON_K === 'e' ? e.totalEarn : ECON_K === 'c' ? e.coinsHeld : e.shopTotal;
  $('chartRange').textContent = hist.length > 1 ? '近 24 小时 · ' + hist.length + ' 个点' : '';
  if (hist.length < 2) {
    svg.innerHTML = '<text x="410" y="128" text-anchor="middle" fill="#6b7385" font-size="13">等面板下一次同步，这里就有走势了</text>';
    $('quoteVal').textContent = fmt(fallback);
    $('quoteVal').style.color = '';
    $('quoteChg').innerHTML = '<span class="chg flat">还没有 24 小时数据</span>';
    $('chartFt').innerHTML = '';
    ECON_PTS = [];
    return;
  }
  const W = 820, H = 260, P = {l: 58, r: 14, t: 16, b: 26};
  const mn0 = Math.min.apply(null, vals), mx0 = Math.max.apply(null, vals);
  const flat = mx0 === mn0;
  const gapv = flat ? Math.max(1, Math.abs(mx0) * 0.06) : (mx0 - mn0);
  const mn = Math.max(0, mn0 - gapv * 0.18), mx = mx0 + gapv * 0.18;
  const X = i => P.l + i / (vals.length - 1) * (W - P.l - P.r);
  const Y = v => P.t + (1 - (v - mn) / (mx - mn)) * (H - P.t - P.b);
  // 大数字用实时的那个汇总值（最多比曲线晚 2 分钟），颜色按它相对 24 小时前是涨是跌
  const lastV = (fallback != null && isFinite(fallback)) ? Number(fallback) : vals[vals.length - 1];
  const qc = {ok: true, d: lastV - vals[0], p: vals[0] ? (lastV - vals[0]) / vals[0] * 100 : null};
  const col = !qc.d ? FLAT_C : (qc.d > 0 ? UP_C : DN_C);
  let g = `<defs><linearGradient id="ecArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${col}" stop-opacity=".24"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>`;
  for (let i = 0; i <= 4; i++) {
    const v = mn + (mx - mn) * i / 4, y = Y(v);
    g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,${i === 0 ? '.09' : '.045'})"/>`;
    g += `<text x="${P.l - 8}" y="${(y + 3.5).toFixed(1)}" text-anchor="end" fill="#5d6675" font-size="10">${fmt(v)}</text>`;
  }
  const step = Math.max(1, Math.round((vals.length - 1) / 5));
  for (let i = 0; i < vals.length; i += step) {
    const x = X(i);
    g += `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${P.t}" y2="${H - P.b}" stroke="rgba(255,255,255,.032)"/>`;
    g += `<text x="${x.toFixed(1)}" y="${H - 8}" text-anchor="middle" fill="#5d6675" font-size="10">${hmof(hist[i].t)}</text>`;
  }
  const line = vals.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('');
  if (flat) {
    g += `<text x="${W - P.r - 2}" y="${P.t + 12}" text-anchor="end" fill="#5d6675" font-size="10">24 小时没有变化</text>`;
  } else {
    g += `<path d="${line} L${X(vals.length - 1).toFixed(1)} ${Y(vals[0]).toFixed(1)} L${X(0).toFixed(1)} ${Y(vals[0]).toFixed(1)} Z" fill="url(#ecArea)"/>`;
    g += `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(vals[0]).toFixed(1)}" y2="${Y(vals[0]).toFixed(1)}" stroke="${FLAT_C}" stroke-dasharray="4 4" opacity=".55"/>`;
    g += `<text x="${W - P.r - 2}" y="${(Y(vals[0]) - 5).toFixed(1)}" text-anchor="end" fill="#5d6675" font-size="9.5">24 小时前 ${fmt(vals[0])}</text>`;
  }
  g += `<path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const lx = X(vals.length - 1).toFixed(1), ly = Y(vals[vals.length - 1]).toFixed(1);
  g += `<circle cx="${lx}" cy="${ly}" r="7" fill="${col}" opacity=".16"/><circle cx="${lx}" cy="${ly}" r="3.2" fill="${col}"/>`;
  g += `<line id="ecV" x1="0" x2="0" y1="${P.t}" y2="${H - P.b}" stroke="rgba(255,255,255,.4)" stroke-dasharray="3 3" opacity="0"/>`;
  g += `<circle id="ecD" cx="0" cy="0" r="4" fill="${col}" stroke="#0b0e15" stroke-width="1.5" opacity="0"/>`;
  svg.innerHTML = g;
  ECON_PTS = vals.map((v, i) => ({x: X(i), y: Y(v), v: v, t: hist[i].t}));

  $('quoteVal').textContent = fmt(lastV);
  $('quoteVal').style.color = col;
  $('quoteChg').innerHTML = chgHtml(qc) + '<span class="dim" style="font-size:11px">较 24 小时前</span>';
  $('chartFt').innerHTML = `<span>24h 最高 <b>${fmt(mx0)}</b></span><span>最低 <b>${fmt(mn0)}</b></span><span>口径 <b>${meta.hint}</b></span><span>截止 <b>${hhmm(D.updated || Date.now())}</b></span>`;

  if (!svg.dataset.wired) {
    svg.dataset.wired = '1';
    const tip = $('chartTip');
    svg.addEventListener('mousemove', ev => {
      if (!ECON_PTS.length) return;
      const r = svg.getBoundingClientRect();
      if (!r.width) return;
      const xv = (ev.clientX - r.left) / r.width * 820;
      let bi = 0, bd = 1e9;
      for (let i = 0; i < ECON_PTS.length; i++) {
        const d = Math.abs(ECON_PTS[i].x - xv);
        if (d < bd) { bd = d; bi = i; }
      }
      const p = ECON_PTS[bi];
      const v = svg.querySelector('#ecV'), dot = svg.querySelector('#ecD');
      if (v && dot) {
        v.setAttribute('x1', p.x); v.setAttribute('x2', p.x); v.setAttribute('opacity', '1');
        dot.setAttribute('cx', p.x); dot.setAttribute('cy', p.y); dot.setAttribute('opacity', '1');
      }
      tip.innerHTML = hmof(p.t) + ' · <b>' + fmt(p.v) + '</b>';
      tip.style.left = (p.x / 820 * 100) + '%';
      tip.style.top = (p.y / 260 * 100) + '%';
      tip.style.opacity = '1';
    });
    svg.addEventListener('mouseleave', () => {
      const v = svg.querySelector('#ecV'), dot = svg.querySelector('#ecD');
      if (v) v.setAttribute('opacity', '0');
      if (dot) dot.setAttribute('opacity', '0');
      $('chartTip').style.opacity = '0';
    });
  }
}

/* ---- 盘口 ---- */
function renderTape() {
  const el = $('tapeRows'); if (!el) return;
  const e = D.economy || {}, ps = D.players || [], rs = D.restaurants || [];
  const todayEarn = ps.reduce((a, p) => a + (p.todayEarn || 0), 0);
  const log = (D.shop && D.shop.log) || [];
  const recent = log.reduce((a, x) => a + (x.price || 0), 0);
  const acc = rs.reduce((a, r) => a + (r.accepted || 0), 0);
  const dl = rs.reduce((a, r) => a + (r.delivery || 0), 0);
  const rate = e.totalEarn ? (e.shopTotal || 0) / e.totalEarn * 100 : 0;
  const per = ps.length ? (e.coinsHeld || 0) / ps.length : 0;
  const rows = [
    {k: '今日营收', v: '+' + fmt(todayEarn), p: 0, cls: 'up'},
    {k: '近 30 笔成交', v: fmt(recent)},
    {k: '消费率（成交 ÷ 营收）', v: rate.toFixed(1) + '%', p: Math.min(1, rate / 100)},
    {k: '人均持币', v: fmt(per)},
    {k: '外卖占比', v: acc ? Math.round(dl / acc * 100) + '%' : '—', p: acc ? dl / acc : 0},
    {k: '最高评级', v: rs.length ? Math.max.apply(null, rs.map(r => r.level || 0)) + ' 星' : '—'},
    {k: '数据截止', v: hhmm(D.updated || Date.now())}
  ];
  el.innerHTML = rows.map(r => `<div class="tape-row"><span class="k">${r.k}</span><span class="v ${r.cls || ''}">${r.v}</span>` +
    (r.p ? `<span class="bar"><i style="width:${Math.min(100, r.p * 100).toFixed(0)}%"></i></span>` : '') + '</div>').join('');
}

/* ---- 餐厅行情 ---- */
function renderRest() {
  const rs = (D.restaurants || []).slice();
  const tot = rs.reduce((a, r) => a + (r.profit || 0), 0);
  $('restInfo').textContent = rs.length ? rs.length + ' 家 · 合计营收 ' + fmt(tot) : '';
  if (!rs.length) { $('restTable').innerHTML = '<tr><td class="empty">还没有开店数据</td></tr>'; return; }
  rs.sort((a, b) => (b[REST_SORT] || 0) - (a[REST_SORT] || 0));
  $('restTable').innerHTML = '<tr><th>#</th><th>餐厅 / 店主</th><th>评级</th><th class="r">接单</th><th class="r">外卖率</th><th class="r">客单价</th><th class="r">营收</th><th>市占</th></tr>' +
    rs.map((r, i) => {
      const acc = r.accepted || 0, dl = r.delivery || 0;
      const rate = acc ? Math.round(dl / acc * 100) : 0;
      const avg = acc ? (r.profit || 0) / acc : 0;
      const share = tot ? (r.profit || 0) / tot * 100 : 0;
      return `<tr><td><span class="rank-n ${i === 0 ? 'top' : ''}">${i + 1}</span></td>` +
        `<td class="name">${esc(r.name || '（没起名）')}<span class="sub">${esc(r.owner || '—')}</span></td>` +
        `<td><span class="stars">${starHtml(Math.max(0, Math.min(8, r.level || 0)))}</span></td>` +
        `<td class="r">${fmt(acc)}</td><td class="r">${rate}%</td><td class="r">${fmt(avg)}</td>` +
        `<td class="r" style="color:var(--amber2)">${fmt(r.profit)}</td>` +
        `<td class="share"><span class="trk"><i style="width:${share.toFixed(1)}%"></i></span><b>${share.toFixed(1)}%</b></td></tr>`;
    }).join('');
}

function renderEco() {
  if (!$('t-eco')) return;
  const ps = D.players || [];
  renderTicker();
  renderTape();
  drawEconChart();
  renderRest();

  const coinRows = ps.map(p => ({n: p.name, v: (p.coins || 0) + (p.coinsEnder || 0) + (p.coinsStored || 0), t: '身上 ' + fmt(p.coins) + ' · 末影箱 ' + fmt(p.coinsEnder) + ' · 存储 ' + fmt(p.coinsStored || 0)})).filter(r => r.v > 0).sort((a, b) => b.v - a.v);
  $('coinBars').innerHTML = coinRows.length
    ? coinRows.slice(0, 12).map(r => `<div class="hbar" title="${esc(r.t)}"><span class="nm">${esc(r.n)}</span><span class="tr"><i style="width:${r.v / coinRows[0].v * 100}%"></i></span><span class="v">${fmt(r.v)}</span></div>`).join('')
      + '<div class="dim" style="font-size:11px;margin-top:8px">鼠标停在名字上看身上 / 末影箱 / 存储各多少；箱子里的币按最后一次数到的算</div>'
    : '<div class="empty">还没有人持有币</div>';

  const todayRows = ps.map(p => ({n: p.name, v: p.todayEarn || 0})).filter(r => r.v > 0).sort((a, b) => b.v - a.v);
  $('todayBars').innerHTML = todayRows.length ? hbars(todayRows, v => '+' + fmt(v), 'var(--red)') : '<div class="empty">今天还没人赚到币</div>';
  const earnRows = ps.map(p => ({n: p.name, v: p.earn || 0})).filter(r => r.v > 0).sort((a, b) => b.v - a.v).slice(0, 10);
  $('earnBars').innerHTML = hbars(earnRows, fmt);

  const items = (D.shop && D.shop.items) || [];
  $('shopTop').innerHTML = items.length
    ? hbars(items.slice(0, 10).map(it => ({n: (it.name || it.id) + ' ×' + it.n, v: it.coins})), fmt)
    : '<div class="empty">还没有人买过东西</div>';
  const byC = {};
  items.forEach(it => { byC[it.counter] = (byC[it.counter] || 0) + it.coins; });
  const cRows = Object.keys(byC).map(k => ({n: COUNTERS[k] || k, v: byC[k], c: /^t|redstone/.test(k) ? 'var(--sky)' : ''})).sort((a, b) => b.v - a.v);
  $('shopCounter').innerHTML = cRows.length ? hbars(cRows, fmt) : '<div class="empty">还没有人买过东西</div>';

  renderEarnTrend();

  const log = ((D.shop && D.shop.log) || []).slice(-30).reverse();
  $('shopLog').innerHTML = log.length
    ? '<tr><th>时间</th><th>买家</th><th>品种</th><th class="r">数量</th><th class="r">单价</th><th class="r">金额</th></tr>'
      + log.map(x => `<tr><td class="dim">${hhmm(x.t)}</td><td class="name">${esc(x.who || '—')}</td>` +
        `<td>${esc(x.name || '—')}<span class="sub">${esc(COUNTERS[x.counter] || x.counter || '')}</span></td>` +
        `<td class="r">×${fmt(x.n)}</td><td class="r">${x.n ? fmt((x.price || 0) / x.n) : '—'}</td>` +
        `<td class="r" style="color:var(--amber2)">${fmt(x.price)}</td></tr>`).join('')
    : '<tr><td class="empty">还没有成交记录（从现在开始记）</td></tr>';
}

function wireEco() {
  const tabs = $('chartTabs');
  if (tabs) tabs.onclick = ev => {
    const b = ev.target.closest('[data-s]'); if (!b) return;
    ECON_K = b.dataset.s;
    Array.from(tabs.children).forEach(x => x.classList.toggle('act', x === b));
    drawEconChart();
  };
  const sort = $('restSort');
  if (sort) sort.onclick = ev => {
    const b = ev.target.closest('[data-k]'); if (!b) return;
    REST_SORT = b.dataset.k;
    Array.from(sort.children).forEach(x => x.classList.toggle('act', x === b));
    renderRest();
  };
}

function renderRank() {
  const ps = D.players || [];
  $('cats').innerHTML = CATS.map(c => `<button class="chip ${cat === c[0] ? 'act' : ''}" data-c="${c[0]}">${c[1]}</button>`).join('');
  const champs = {};
  const cards = BOARDS.map(b => {
    const rows = ps.map(p => ({p, v: b.v(p)})).filter(r => r.v != null && r.v > 0).sort((a, c) => c.v - a.v);
    if (rows.length) (champs[rows[0].p.name] = champs[rows[0].p.name] || []).push(b.nick);
    return {b, rows};
  });
  const wall = Object.keys(champs).sort((a, b) => champs[b].length - champs[a].length);
  $('wall').innerHTML = wall.length ? '<div class="wall">' + wall.map(n => `<div>${ava(n, 38)}<div style="min-width:0;flex:1">
    <div style="display:flex;align-items:baseline;gap:8px"><b>${esc(n)}</b><span class="cnt">${champs[n].length}</span><span class="dim" style="font-size:12px">个第一</span></div>
    <div class="tags">${champs[n].map(t => `<span>${esc(t)}</span>`).join('')}</div></div></div>`).join('') + '</div>' : '<div class="empty">还没有数据</div>';
  const shown = cards.filter(x => cat === 'all' || x.b.c === cat);
  const empty = shown.filter(x => !x.rows.length).map(x => x.b.t);
  const medal = ['🥇', '🥈', '🥉'];
  $('boards').innerHTML = shown.filter(x => x.rows.length).map(({b, rows}) => `<div class="card"><h3>${esc(b.t)}<span class="r">${esc(rows[0].p.name)} · ${esc(b.nick)}</span></h3>
    ${rows.slice(0, 5).map((r, i) => `<div class="row ${i ? '' : 'first'}"><span class="md">${medal[i] || '<span class="dim" style="font-size:12px">' + (i + 1) + '</span>'}</span><span class="nm">${esc(r.p.name)}</span><span class="v">${esc(b.f(r.v))}</span><span class="tr"><i style="width:${r.v / rows[0].v * 100}%"></i></span></div>`).join('')}</div>`).join('')
    + (empty.length ? `<div class="dim" style="grid-column:1/-1;font-size:12.5px">还没人上榜：${empty.map(esc).join('、')}</div>` : '');
}

function renderPlayers() {
  const ps = (D.players || []).slice().sort((a, b) => (b.online - a.online) || (b.earn || 0) - (a.earn || 0));
  if (!ps.length) { $('players').innerHTML = '<div class="card empty">还没有玩家数据</div>'; return; }
  $('players').innerHTML = ps.map(p => {
    const earn = p.earn || 0, nextMs = EARN_MS.find(v => v > earn);
    const ticks = EARN_MS.map(v => `<s class="${earn >= v ? 'ok' : ''}" style="left:calc(${v / 250}% - 1px)"></s>`).join('');
    let mems = '';
    for (let i = 1; i <= 7; i++) {
      const pend = (p.memPending || []).includes(i), lit = p.lamps && p.lamps[i - 1];
      mems += `<span class="mem ${pend ? 'pend' : lit ? 'has' : ''}" title="记忆碎片 ${i}${pend ? '：营收还不够，暂时没发' : ''}"></span>`;
    }
    const n = lampN(p);
    const stage = p.home ? '<span style="color:var(--violet)">已经回到零号星</span>'
      : p.bill ? '结清了账单，就差亲手把归乡宴交给阿零' : p.feast ? '七盏灯全亮，在做终章'
      : n ? `已点亮 ${n} 盏灯，下一盏：${LAMPS[n] || '终章'}` : (p.otcFirst ? '餐厅开张了，在点第一盏灯' : '刚到深夜食堂');
    let stars = ''; for (let i = 1; i <= 8; i++) stars += i <= (p.star || 0) ? '<b>★</b>' : '★';
    return `<div class="card pc">
      <div class="hd">${ava(p.name, 46)}<div style="min-width:0">
        <div class="nm">${esc(p.name)}${p.home ? '<span class="badge">已归乡</span>' : ''}</div>
        <div class="sub">${p.online ? '<span class="on-dot"></span>正在玩' : '上次在线 ' + ago(p.lastSeen)}</div></div></div>
      <div class="kv">
        <div class="k">进度</div><div>${stage}</div>
        <div class="k">餐厅</div><div><span class="stars">${stars}</span> <span class="dim">${p.star || 0} 星</span></div>
        <div class="k">累计营收</div><div><b>${fmt(earn)}</b> <span class="dim">/ 25,000${nextMs ? ' · 下一档 ' + fmt(nextMs) : ' · 满了'}</span><div class="prog"><i style="width:${Math.min(100, earn / 250)}%"></i>${ticks}</div></div>
        <div class="k">七盏灯</div><div class="lamps">${LAMPS.map((t, i) => `<span class="lamp ${p.lamps && p.lamps[i] ? 'lit' : ''}" title="第${i + 1}盏灯 · ${t}"></span>`).join('')}</div>
        <div class="k">记忆碎片</div><div class="mems">${mems}<span class="dim" style="margin-left:8px">${p.mem || 0} / 7</span></div>
        <div class="k">Boss</div><div>${(p.bosses || []).length ? `<b style="color:var(--amber2)">${p.bosses.length}</b> <span class="dim">/ ${D.bossTotal || 25} · ${p.bosses.slice(-4).map(esc).join('、')}</span>` : '<span class="dim">还没有</span>'}</div>
        <div class="k">成就</div><div>${p.adv ? `${p.adv.n} 个 · <b style="color:var(--amber2)">${p.adv.pts}</b> 分` : '—'}</div>
        <div class="k">在线</div><div>${dur(p.onlineTotal)} <span class="dim">· 今天 ${dur(p.onlineToday)}</span></div>
      </div></div>`;
  }).join('');
}

function renderOnline24() {
  const rows = D.online24 || [];
  const el = $('online24');
  $('tlInfo').textContent = rows.length ? rows.length + ' 人来过' : '';
  if (!rows.length) { el.innerHTML = '<div class="empty">近 24 小时没人进服</div>'; return; }
  const end = D.updated || Date.now(), from = end - 864e5;
  const W = t => Math.max(0, Math.min(100, (t - from) / (end - from) * 100));
  const hm = t => new Date(t).toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
  let axis = '';
  for (let h = Math.ceil(from / 3600e3) * 3600e3; h <= end; h += 3600e3) {
    const hr = new Date(h).getHours();
    if (hr % 4 === 0) axis += `<span style="left:${W(h)}%">${String(hr).padStart(2, '0')}:00</span>`;
  }
  const anyLive = rows.some(r => (r.segs || []).some(s => s[2]));
  el.innerHTML = rows.map(r => {
    const segs = (r.segs || []).filter(s => s[1] > from);
    return `<div class="tl-row"><span class="nm" title="${esc(r.n)}">${esc(r.n)}</span>` +
      `<div class="tl-track">${segs.map(s => `<i class="${s[2] ? 'live' : ''}" style="left:${W(s[0])}%;width:${Math.max(0.4, W(s[1]) - W(s[0]))}%" title="${hm(s[0])} – ${s[2] ? '现在还在服里' : hm(s[1])}"></i>`).join('')}</div>` +
      `<span class="v">${dur(r.ms)}</span></div>`;
  }).join('') +
    `<div class="tl-axis"><i></i><div>${axis}</div><i></i></div>` +
    `<div class="dim" style="font-size:11.5px;margin-top:10px">${anyLive ? '绿色是现在还在服里；' : ''}横轴是最近 24 小时，鼠标停在色块上看具体时间；进出记录从装上面板脚本开始记。</div>`;
}
function render() {
  const live = D.server && D.server.online && Date.now() - D.updated < 40 * 60000;
  const s = $('srv');
  s.className = 'pill' + (live ? ' on' : '');
  s.lastElementChild.textContent = live ? `服务器开着 · ${D.server.players} 人在线` : '服务器休息中';
  $('upd').textContent = '更新于 ' + ago(D.updated) + (live ? '' : (Date.now() - D.updated > 40 * 60000 ? '（服务器或面板没开，数据停在这里）' : ''));
  renderOnline24();
  renderRank();
  renderPlayers();
  renderEco();
}

async function load() {
  try {
    const r = await fetch('data.json?t=' + Date.now(), {cache: 'no-store'});
    if (!r.ok) throw new Error(r.status);
    D = await r.json();
    render();
  } catch (e) {
    if (!D) $('upd').textContent = '数据还没上传，等服务器面板第一次同步';
  }
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('act', x === b));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('act', t.id === 't-' + b.dataset.t));
});
wireEco();

$('cats').onclick = e => {
  const b = e.target.closest('[data-c]'); if (!b) return;
  cat = b.dataset.c; try { localStorage.setItem('shenyeCat', cat); } catch (x) {}
  renderRank();
};
load();
setInterval(load, 120000);
setInterval(() => { if (D) render(); }, 30000);
</script>
</body>
</html>
